let run=null;
function startScenario(id){
  const s=SCENARIOS.find(x=>x.id===id); if(!s) return;
  run={s,node:"n1",score:0,max:0,steps:0}; renderScenario(); window.scrollTo(0,0);
}
function monitorHTML(mon,cat){
  const model=invModels(cat)[0]; const L=model&&model.labels||{pv:"P venosa",pi:"P pre-oxi",pa:"P post-oxi"};
  return Object.entries(mon||{}).map(([k,v])=>{const [val,unit="",st=""]=Array.isArray(v)?v:[v];const key=L[k]||k;
    return `<div class="ro ${st}"><div class="k">${esc(key)}</div><div class="v">${esc(val)}</div><div class="u">${esc(unit)}</div></div>`}).join("");
}
function totalDecisions(s){let n=0,k="n1";while(s.nodes[k]&&!s.nodes[k].end){n++;k=s.nodes[k].ch[0].n}return n}
function renderScenario(answered){
  const {s}=run, nd=s.nodes[run.node], tot=totalDecisions(s);
  const model=invModels(s.cat)[0];
  if(nd.end){
    const pct=run.max?Math.round(run.score/run.max*100):0; results[s.id]=pct; store.set("res",results);
    $("#view").innerHTML=`<p><a href="#casos">← Casos</a></p><section class="card" style="gap:12px"><p class="eyebrow">Debriefing</p><h2>${esc(s.title)}</h2>
     <div class="stats"><div class="stat"><b>${pct}%</b><span class="muted small">puntaje</span></div><div class="stat"><b>${run.score}/${run.max}</b><span class="muted small">puntos</span></div></div>
     <p>${esc(nd.text)}</p><h3>Puntos clave</h3><ul class="clean">${nd.key.map(k=>`<li>${esc(k)}</li>`).join("")}</ul>${srcLinks(s.src)}
     <div class="row"><button class="btn" type="button" id="again">Repetir caso</button><a class="btn ghost" href="#casos" style="text-decoration:none">Otro caso</a></div></section>`;
    $("#again").onclick=()=>startScenario(s.id); return;
  }
  const lastMon = nd.mon || run.lastMon; run.lastMon=lastMon;
  $("#view").innerHTML=`<p><a href="#casos">← Casos</a></p>
   <div style="display:flex;flex-direction:column;gap:6px"><div class="row"><span class="chip acc">${catName(s.cat)} · ${s.mode}</span><span class="chip">${s.level}</span>${model?`<span class="chip">Equipo: ${esc(model.name)}</span>`:""}</div><h2>${esc(s.title)}</h2>
   <div class="progress" aria-label="Progreso"><i style="width:${Math.round(run.steps/tot*100)}%"></i></div></div>
   <div class="scn">
    <aside class="monitor" aria-label="Monitor simulado"><div class="mh"><span>${s.cat==="ecmo"?"Consola ECMO / monitor":"Máquina de CRRT / laboratorio"}</span><span>SIMULADO</span></div>
     ${nd.alarm?`<div class="alarmbar blink" role="alert">▲ ${esc(nd.alarm)}</div>`:""}
     <div class="readouts">${monitorHTML(lastMon,s.cat)}</div></aside>
    <section style="display:flex;flex-direction:column;gap:12px;min-width:0">
     ${nd.text?`<p>${esc(nd.text)}</p>`:""}<h3>${esc(nd.q)}</h3>
     <div class="choices">${nd.ch.map((c,i)=>`<button type="button" class="choice" data-i="${i}">${esc(c.l)}</button>`).join("")}</div>
     <div id="fb"></div>
    </section></div>`;
  document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    const c=nd.ch[+b.dataset.i]; const best=Math.max(...nd.ch.map(x=>x.s));
    run.score+=c.s; run.max+=best; run.steps++;
    document.querySelectorAll(".choice").forEach((x,i)=>{x.disabled=true;const sc=nd.ch[i].s;if(i===+b.dataset.i||sc===best)x.classList.add(sc===2?"best":sc===1?"mid":"bad")});
    const cls=c.s===2?"best":c.s===1?"mid":"bad", lab=c.s===2?"Mejor práctica":c.s===1?"Incompleto":"Inseguro";
    $("#fb").innerHTML=`<div class="fb ${cls}" role="status"><b>${lab}.</b> ${esc(c.f)}</div><div class="row" style="margin-top:10px"><button class="btn" type="button" id="next">Continuar</button></div>`;
    $("#next").onclick=()=>{run.node=c.n;renderScenario()}; $("#next").focus();
  });
}

/* ---------- Questions ---------- */
function renderQuestions(){
  const f=$("#pfilters [aria-pressed=true]")?.dataset.c||"all";
  $("#plist").innerHTML=QUESTIONS.map((q,qi)=>({q,qi})).filter(x=>f==="all"||x.q.cat===f).map(({q,qi})=>`<article class="card" data-q="${qi}"><div class="row"><span class="chip">${catName(q.cat)}</span></div><h3>${esc(q.q)}</h3>
   <div class="choices">${q.o.map((o,i)=>`<button type="button" class="choice" data-o="${i}">${esc(o)}</button>`).join("")}</div><div class="exp"></div></article>`).join("");
  document.querySelectorAll("#plist article").forEach(card=>{const q=QUESTIONS[+card.dataset.q];
    card.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{const i=+b.dataset.o;
      card.querySelectorAll(".choice").forEach((x,j)=>{x.disabled=true;if(j===q.a)x.classList.add("best");else if(j===i)x.classList.add("bad")});
      card.querySelector(".exp").innerHTML=`<div class="fb ${i===q.a?"best":"bad"}"><b>${i===q.a?"Correcto.":"Incorrecto."}</b> ${esc(q.e)}</div>${srcLinks(q.src)}`;})});
}

/* ---------- Router ---------- */
function route(){
  const h=(location.hash||"#inicio").slice(1);
  if(h.startsWith("caso-")&&SCENARIOS.some(x=>x.id===h.slice(5))){document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current",a.getAttribute("href")==="#casos"?"page":"false"));startScenario(h.slice(5));return}
  const v=views[h]?h:"inicio";
  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current",a.getAttribute("href")==="#"+v?"page":"false"));
  $("#view").innerHTML=views[v]();
  if(v==="turno"){renderQuick();$("#qsearch").oninput=renderQuick;wireFilters("#qfilters",renderQuick)}
  if(v==="preguntas"){renderQuestions();wireFilters("#pfilters",renderQuestions)}
  if(v==="casos"){document.querySelectorAll("[data-scn]").forEach(b=>b.onclick=()=>{location.hash="caso-"+b.dataset.scn})}
  if(v==="equipos"){document.querySelectorAll("[data-dev]").forEach(cb=>cb.onchange=()=>{inventory=[...document.querySelectorAll("[data-dev]:checked")].map(x=>x.dataset.dev);store.set("inv",inventory)})}
}
function wireFilters(sel,fn){document.querySelectorAll(sel+" button").forEach(b=>b.onclick=()=>{document.querySelectorAll(sel+" button").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");fn()})}
window.addEventListener("hashchange",route);
$("#themeBtn").onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";store.set("theme",r.dataset.theme)};
(()=>{const t=store.get("theme",null);if(t)document.documentElement.dataset.theme=t})();
route();
</script>
